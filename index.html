<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
        
        @keyframes smoothSlideUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-smooth-slide { animation: smoothSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spinner { animation: spinLoader 0.8s linear infinite; }

        @keyframes pageFadeIn { 0% { opacity: 0; transform: translateY(10px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-page-fade-in { animation: pageFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-0 md:p-4">

    <!-- Container Utama (Disamakan persis dengan Web Ulasan) -->
    <div id="main-container" class="w-full max-w-md min-h-screen md:min-h-0 bg-white md:rounded-2xl md:shadow-sm md:border md:border-slate-100 p-6 sm:p-8 text-center flex flex-col justify-center relative overflow-hidden">
        
        <!-- HALAMAN LOGIN OWNER -->
        <div id="loginScreen" class="space-y-5 text-left animate-page-fade-in">
            <div class="text-center mb-6">
                <div class="w-10 h-1 bg-blue-600 mx-auto rounded-full mb-3"></div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Owner Portal</h1>
                <p class="text-xs text-slate-500 mt-1">Masukkan ID kartu dan PIN rahasia untuk melihat statistik.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ID Kartu</label>
                <input type="text" id="inputCardId" placeholder="Contoh: NFC-001" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none" autocomplete="off">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">PIN Keamanan</label>
                <input type="password" id="inputPin" placeholder="••••" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>

            <button onclick="prosesLogin()" id="btn-login" class="w-full bg-blue-600 text-white font-medium py-3 rounded-xl hover:bg-blue-700 transition shadow-sm mt-2 flex items-center justify-center gap-2">
                <span>Masuk Dashboard</span>
            </button>

            <div id="loadingText" class="hidden text-center text-xs text-slate-400 pt-2">Menghubungkan ke database...</div>
        </div>

        <!-- HALAMAN DASHBOARD STATISTIK -->
        <div id="dashboardScreen" class="hidden space-y-6 text-left animate-page-fade-in">
            <div class="text-center space-y-1">
                <div class="w-10 h-1 bg-blue-600 mx-auto rounded-full mb-3"></div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Statistik Kartu</h1>
                <span id="badgeCardId" class="inline-block bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase mt-1">ID: -</span>
            </div>

            <!-- List Bar Grafik Statistik (Clean & Modern) -->
            <div class="space-y-4 pt-2">
                <!-- Statistik 1 -->
                <div class="bg-slate-50/60 border border-slate-100 p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-semibold text-slate-600">Total Pengunjung</span>
                        <span id="statVisitor" class="text-lg font-bold text-slate-900">0</span>
                    </div>
                    <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
                        <div id="barVisitor" class="h-full bg-blue-600 rounded-full transition-all duration-700 w-0"></div>
                    </div>
                </div>

                <!-- Statistik 2 -->
                <div class="bg-slate-50/60 border border-slate-100 p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-semibold text-slate-600">Klik Google Maps</span>
                        <span id="statMaps" class="text-lg font-bold text-slate-900">0</span>
                    </div>
                    <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
                        <div id="barMaps" class="h-full bg-blue-600 rounded-full transition-all duration-700 w-0"></div>
                    </div>
                </div>

                <!-- Statistik 3 -->
                <div class="bg-slate-50/60 border border-slate-100 p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-semibold text-slate-600">Klik Masukan WA</span>
                        <span id="statWA" class="text-lg font-bold text-slate-900">0</span>
                    </div>
                    <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
                        <div id="barWA" class="h-full bg-blue-600 rounded-full transition-all duration-700 w-0"></div>
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi Bawah -->
            <div class="flex gap-2 pt-2">
                <button onclick="refreshData()" class="flex-1 bg-slate-100 text-slate-700 font-medium py-2.5 rounded-xl text-xs hover:bg-slate-200 transition">
                    Perbarui Data
                </button>
                <button onclick="logoutApp()" class="flex-1 bg-red-50 text-red-600 font-medium py-2.5 rounded-xl text-xs hover:bg-red-100 transition">
                    Keluar Akun
                </button>
            </div>
        </div>

    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCV2-_bBSOJ0QqiW2Zu0zUViO-T42IAihhF_-LSiwqRT26i0-3QZdKTmMC8VW1ovHH/exec";
        let activeCardId = "";

        window.onload = function() {
            let savedCardId = localStorage.getItem("active_owner_card");
            if (savedCardId && localStorage.getItem("owner_logged_" + savedCardId) === "true") {
                activeCardId = savedCardId;
                tampilkanDashboardFromCache();
            }
        };

        function prosesLogin() {
            let cardIdVal = document.getElementById("inputCardId").value.trim();
            let pinVal = document.getElementById("inputPin").value.trim();

            if (!cardIdVal || !pinVal) {
                alert("ID Kartu dan PIN wajib diisi!");
                return;
            }

            document.getElementById("loadingText").classList.remove("hidden");

            fetch(`${SCRIPT_URL}?action=owner_login&product_id=${encodeURIComponent(cardIdVal)}&pin=${encodeURIComponent(pinVal)}`)
                .then(response => response.json())
                .then(res => {
                    document.getElementById("loadingText").classList.add("hidden");
                    if (res.success) {
                        activeCardId = cardIdVal;

                        localStorage.setItem("active_owner_card", activeCardId);
                        localStorage.setItem("owner_logged_" + activeCardId, "true");
                        localStorage.setItem("stat_visitor_" + activeCardId, res.data.visitor);
                        localStorage.setItem("stat_maps_" + activeCardId, res.data.maps);
                        localStorage.setItem("stat_wa_" + activeCardId, res.data.wa);

                        tampilkanDashboardFromCache();
                    } else {
                        alert(res.message);
                    }
                })
                .catch(error => {
                    document.getElementById("loadingText").classList.add("hidden");
                    console.error("Error:", error);
                    alert("Terjadi kesalahan koneksi.");
                });
        }

        function updateChartBars(v, m, w) {
            let visitor = Number(v) || 0;
            let maps = Number(m) || 0;
            let wa = Number(w) || 0;
            let max = Math.max(visitor, maps, wa, 1);

            setTimeout(() => {
                document.getElementById("barVisitor").style.width = Math.round((visitor / max) * 100) + "%";
                document.getElementById("barMaps").style.width = Math.round((maps / max) * 100) + "%";
                document.getElementById("barWA").style.width = Math.round((wa / max) * 100) + "%";
            }, 100);
        }

        function tampilkanDashboardFromCache() {
            document.getElementById("loginScreen").classList.add("hidden");
            const dash = document.getElementById("dashboardScreen");
            dash.classList.remove("hidden");
            
            document.getElementById("badgeCardId").innerText = "ID: " + activeCardId;

            let v = localStorage.getItem("stat_visitor_" + activeCardId) || 0;
            let m = localStorage.getItem("stat_maps_" + activeCardId) || 0;
            let w = localStorage.getItem("stat_wa_" + activeCardId) || 0;

            document.getElementById("statVisitor").innerText = v;
            document.getElementById("statMaps").innerText = m;
            document.getElementById("statWA").innerText = w;

            updateChartBars(v, m, w);
        }

        function refreshData() {
            if (!activeCardId) {
                location.reload();
                return;
            }

            fetch(`${SCRIPT_URL}?action=refresh_stats&product_id=${encodeURIComponent(activeCardId)}`)
                .then(response => response.json())
                .then(res => {
                    if (res.success) {
                        localStorage.setItem("stat_visitor_" + activeCardId, res.data.visitor);
                        localStorage.setItem("stat_maps_" + activeCardId, res.data.maps);
                        localStorage.setItem("stat_wa_" + activeCardId, res.data.wa);

                        document.getElementById("statVisitor").innerText = res.data.visitor;
                        document.getElementById("statMaps").innerText = res.data.maps;
                        document.getElementById("statWA").innerText = res.data.wa;

                        updateChartBars(res.data.visitor, res.data.maps, res.data.wa);
                    } else {
                        alert("Gagal memperbarui data.");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Koneksi gagal.");
                });
        }

        function logoutApp() {
            if (activeCardId) {
                localStorage.removeItem("owner_logged_" + activeCardId);
                localStorage.removeItem("stat_visitor_" + activeCardId);
                localStorage.removeItem("stat_maps_" + activeCardId);
                localStorage.removeItem("stat_wa_" + activeCardId);
            }
            localStorage.removeItem("active_owner_card");
            location.reload(); 
        }
    </script>
</body>
</html>
