<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard</title>
    
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #fafafa; 
            margin: 0; 
            padding: 24px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 90vh; 
            color: #0f172a; 
        }

        .wrapper { 
            width: 100%; 
            max-width: 420px; 
            background: #ffffff; 
            padding: 32px; 
            border-radius: 24px; 
            border: 1px solid #f1f5f9;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); 
        }

        .login-header {
            text-align: left;
            margin-bottom: 28px;
        }
        .login-header h2 {
            margin: 0 0 6px 0;
            color: #0f172a;
            font-size: 22px;
            font-weight: 700;
        }
        .login-header p {
            margin: 0;
            color: #64748b;
            font-size: 13px;
        }

        .form-group { 
            margin-bottom: 18px; 
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 500; 
            font-size: 12px; 
            color: #64748b; 
        }
        input { 
            width: 100%; 
            padding: 12px 14px; 
            background: #f8fafc;
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 14px; 
            color: #0f172a;
        }
        input:focus { 
            outline: none; 
            border-color: #0f172a; 
            background: #ffffff;
        }

        .btn-primary { 
            width: 100%; 
            padding: 13px; 
            background: #0f172a; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 14px; 
            margin-top: 8px;
        }
        .btn-primary:hover { background: #1e293b; }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }
        .dash-header h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: #0f172a;
            font-weight: 700;
        }
        .badge-id {
            background: #f1f5f9;
            color: #475569;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Tampilan Clean List & Bar Grafik */
        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-row { 
            background: #f8fafc; 
            border: 1px solid #f1f5f9;
            padding: 16px; 
            border-radius: 16px; 
        }
        .stat-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .stat-info h3 { 
            margin: 0; 
            font-size: 12px; 
            color: #64748b; 
            font-weight: 500;
        }
        .stat-info p { 
            margin: 0; 
            font-size: 18px; 
            font-weight: 700; 
            color: #0f172a; 
        }
        
        /* Bar Grafik Minimalis */
        .chart-track {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .chart-fill {
            height: 100%;
            background: #0f172a;
            border-radius: 4px;
            width: 0%;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dash-actions {
            display: flex;
            gap: 8px;
        }
        .btn-refresh { 
            flex: 2;
            padding: 11px; 
            background: #f8fafc; 
            color: #0f172a; 
            border: 1px solid #e2e8f0;
            border-radius: 12px; 
            font-weight: 500; 
            cursor: pointer; 
            font-size: 13px;
        }
        .btn-refresh:hover { background: #f1f5f9; }

        .btn-logout { 
            flex: 1;
            padding: 11px; 
            background: #fff; 
            color: #ef4444; 
            border: 1px solid #fee2e2;
            border-radius: 12px; 
            font-weight: 500; 
            cursor: pointer; 
            font-size: 13px;
        }
        .btn-logout:hover { background: #fef2f2; }

        .loading-text {
            display: none;
            text-align: center;
            margin-top: 14px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- HALAMAN LOGIN -->
        <div id="loginScreen">
            <div class="login-header">
                <h2>Masuk Dashboard</h2>
                <p>Masukkan ID kartu dan PIN rahasia Anda</p>
            </div>
            
            <div class="form-group">
                <label>ID Kartu</label>
                <input type="text" id="inputCardId" placeholder="Contoh: NFC-001" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>PIN Keamanan</label>
                <input type="password" id="inputPin" placeholder="••••">
            </div>
            
            <button class="btn-primary" onclick="prosesLogin()">Masuk</button>
            <div id="loadingText" class="loading-text">Menghubungkan...</div>
        </div>

        <!-- HALAMAN DASHBOARD -->
        <div id="dashboardScreen" style="display: none;">
            <div class="dash-header">
                <div>
                    <h2>Statistik Kartu</h2>
                    <span id="badgeCardId" class="badge-id">ID: -</span>
                </div>
            </div>
            
            <div class="stats-container">
                <!-- Baris Statistik 1: Pengunjung -->
                <div class="stat-row">
                    <div class="stat-info">
                        <h3>Total Pengunjung</h3>
                        <p id="statVisitor">0</p>
                    </div>
                    <div class="chart-track">
                        <div id="barVisitor" class="chart-fill"></div>
                    </div>
                </div>

                <!-- Baris Statistik 2: Google Maps -->
                <div class="stat-row">
                    <div class="stat-info">
                        <h3>Klik Google Maps</h3>
                        <p id="statMaps">0</p>
                    </div>
                    <div class="chart-track">
                        <div id="barMaps" class="chart-fill"></div>
                    </div>
                </div>

                <!-- Baris Statistik 3: WhatsApp -->
                <div class="stat-row">
                    <div class="stat-info">
                        <h3>Klik Masukan WA</h3>
                        <p id="statWA">0</p>
                    </div>
                    <div class="chart-track">
                        <div id="barWA" class="chart-fill"></div>
                    </div>
                </div>
            </div>

            <div class="dash-actions">
                <button class="btn-refresh" onclick="refreshData()">Perbarui Data</button>
                <button class="btn-logout" onclick="logoutApp()">Keluar</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCV2-_bBSOJ0QqiW2Zu0zUViO-T42IAihhF_-LSiwqRT26i0-3QZdKTmMC8VW1ovHH/exec";

        let activeCardId = "";

        window.onload = function() {
            let savedCardId = localStorage.getItem("active_owner_card");
            if (savedCardId && localStorage.getItem("owner_logged_" + savedCardId) === "true") {
                activeCardId = savedCardId;
                tampilkanDashboardFromCache();
            }
        };

        function prosesLogin() {
            let cardIdVal = document.getElementById("inputCardId").value.trim();
            let pinVal = document.getElementById("inputPin").value.trim();

            if (!cardIdVal || !pinVal) {
                alert("ID Kartu dan PIN wajib diisi!");
                return;
            }

            document.getElementById("loadingText").style.display = "block";

            fetch(`${SCRIPT_URL}?action=owner_login&product_id=${encodeURIComponent(cardIdVal)}&pin=${encodeURIComponent(pinVal)}`)
                .then(response => response.json())
                .then(res => {
                    document.getElementById("loadingText").style.display = "none";
                    if (res.success) {
                        activeCardId = cardIdVal;

                        localStorage.setItem("active_owner_card", activeCardId);
                        localStorage.setItem("owner_logged_" + activeCardId, "true");
                        localStorage.setItem("stat_visitor_" + activeCardId, res.data.visitor);
                        localStorage.setItem("stat_maps_" + activeCardId, res.data.maps);
                        localStorage.setItem("stat_wa_" + activeCardId, res.data.wa);

                        tampilkanDashboardFromCache();
                    } else {
                        alert(res.message);
                    }
                })
                .catch(error => {
                    document.getElementById("loadingText").style.display = "none";
                    console.error("Error:", error);
                    alert("Terjadi kesalahan koneksi.");
                });
        }

        function updateChartBars(v, m, w) {
            let visitor = Number(v) || 0;
            let maps = Number(m) || 0;
            let wa = Number(w) || 0;

            let max = Math.max(visitor, maps, wa, 1); // Hindari pembagian dengan 0

            setTimeout(() => {
                document.getElementById("barVisitor").style.width = Math.round((visitor / max) * 100) + "%";
                document.getElementById("barMaps").style.width = Math.round((maps / max) * 100) + "%";
                document.getElementById("barWA").style.width = Math.round((wa / max) * 100) + "%";
            }, 100);
        }

        function tampilkanDashboardFromCache() {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("dashboardScreen").style.display = "block";
            
            document.getElementById("badgeCardId").innerText = "ID: " + activeCardId;

            let v = localStorage.getItem("stat_visitor_" + activeCardId) || 0;
            let m = localStorage.getItem("stat_maps_" + activeCardId) || 0;
            let w = localStorage.getItem("stat_wa_" + activeCardId) || 0;

            document.getElementById("statVisitor").innerText = v;
            document.getElementById("statMaps").innerText = m;
            document.getElementById("statWA").innerText = w;

            updateChartBars(v, m, w);
        }

        function refreshData() {
            if (!activeCardId) {
                location.reload();
                return;
            }

            const btnRefresh = document.querySelector('.btn-refresh');
            btnRefresh.innerText = "Memuat...";

            fetch(`${SCRIPT_URL}?action=refresh_stats&product_id=${encodeURIComponent(activeCardId)}`)
                .then(response => response.json())
                .then(res => {
                    btnRefresh.innerText = "Perbarui Data";
                    if (res.success) {
                        localStorage.setItem("stat_visitor_" + activeCardId, res.data.visitor);
                        localStorage.setItem("stat_maps_" + activeCardId, res.data.maps);
                        localStorage.setItem("stat_wa_" + activeCardId, res.data.wa);

                        document.getElementById("statVisitor").innerText = res.data.visitor;
                        document.getElementById("statMaps").innerText = res.data.maps;
                        document.getElementById("statWA").innerText = res.data.wa;

                        updateChartBars(res.data.visitor, res.data.maps, res.data.wa);
                    } else {
                        alert("Gagal memperbarui data.");
                    }
                })
                .catch(error => {
                    btnRefresh.innerText = "Perbarui Data";
                    console.error("Error:", error);
                    alert("Koneksi gagal.");
                });
        }

        function logoutApp() {
            if (activeCardId) {
                localStorage.removeItem("owner_logged_" + activeCardId);
                localStorage.removeItem("stat_visitor_" + activeCardId);
                localStorage.removeItem("stat_maps_" + activeCardId);
                localStorage.removeItem("stat_wa_" + activeCardId);
            }
            localStorage.removeItem("active_owner_card");
            location.reload(); 
        }
    </script>
</body>
</html>
