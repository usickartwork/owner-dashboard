<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Owner - Kelola Kartu</title>
    <!-- Masukkan style / Tailwind / CSS bawaan desain lama Anda di sini -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8">
        
        <!-- HALAMAN LOGIN OWNER -->
        <div id="login-section" class="space-y-4">
            <div class="text-center mb-6">
                <h1 class="text-xl font-bold text-slate-900">Dashboard Owner</h1>
                <p class="text-xs text-slate-500 mt-1">Masukkan ID Kartu dan PIN untuk melihat statistik.</p>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ID Kartu</label>
                <input type="text" id="login-id" placeholder="Contoh: kartu01" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">PIN Keamanan</label>
                <input type="password" id="login-pin" placeholder="Masukkan PIN" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>
            <button onclick="ownerLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition shadow-sm mt-2 text-sm">
                Masuk ke Dashboard
            </button>
        </div>

        <!-- HALAMAN DASHBOARD UTAMA -->
        <div id="dashboard-section" class="hidden space-y-5">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <div>
                    <h2 id="dash-business-name" class="text-base font-bold text-slate-900">Nama Bisnis</h2>
                    <p class="text-[11px] text-slate-400">Panel Kontrol & Statistik Kartu</p>
                </div>
                <button onclick="refreshStats()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                    🔄 Refresh
                </button>
            </div>

            <!-- KARTU STATISTIK -->
            <div class="grid grid-cols-3 gap-2.5">
                <div class="bg-blue-50/50 border border-blue-100 p-3 rounded-xl text-center">
                    <span class="block text-[11px] font-medium text-slate-500">Visitor</span>
                    <span id="stat-visitor" class="text-lg font-bold text-blue-600">0</span>
                </div>
                <div class="bg-emerald-50/50 border border-emerald-100 p-3 rounded-xl text-center">
                    <span class="block text-[11px] font-medium text-slate-500">Klik Maps</span>
                    <span id="stat-maps" class="text-lg font-bold text-emerald-600">0</span>
                </div>
                <div class="bg-amber-50/50 border border-amber-100 p-3 rounded-xl text-center">
                    <span class="block text-[11px] font-medium text-slate-500">Klik WA</span>
                    <span id="stat-wa" class="text-lg font-bold text-amber-600">0</span>
                </div>
            </div>

            <!-- RINGKASAN RATING -->
            <div class="bg-slate-50 border border-slate-100 p-4 rounded-xl space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-slate-700">Total Ulasan Masuk</span>
                    <span id="stat-total-ulasan" class="text-xs font-bold text-slate-900">0 Ulasan</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-slate-700">Rating Keseluruhan</span>
                    <span id="stat-overall-rating" class="text-sm font-extrabold text-amber-500">0.0 ★</span>
                </div>
                
                <!-- DETAIL BINTANG -->
                <div class="pt-2 border-t border-slate-200/60 text-[11px] text-slate-500 space-y-1">
                    <div class="flex justify-between"><span>Bintang 5:</span><span id="b5" class="font-bold text-slate-700">0</span></div>
                    <div class="flex justify-between"><span>Bintang 4:</span><span id="b4" class="font-bold text-slate-700">0</span></div>
                    <div class="flex justify-between"><span>Bintang 3:</span><span id="b3" class="font-bold text-slate-700">0</span></div>
                    <div class="flex justify-between"><span>Bintang 2:</span><span id="b2" class="font-bold text-slate-700">0</span></div>
                    <div class="flex justify-between"><span>Bintang 1:</span><span id="b1" class="font-bold text-slate-700">0</span></div>
                </div>
            </div>

            <!-- TOMBOL AKSI -->
            <div class="space-y-2 pt-2">
                <button onclick="confirmReset()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-medium py-2.5 rounded-xl text-xs transition border border-red-200">
                    ⚠️ Reset / Hapus Data Kartu Ini
                </button>
                <button onclick="logoutOwner()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2.5 rounded-xl text-xs transition">
                    Keluar Akun
                </button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCV2-_bBSOJ0QqiW2Zu0zUViO-T42IAihhF_-LSiwqRT26i0-3QZdKTmMC8VW1ovHH/exec";
        
        let currentProductId = localStorage.getItem('owner_product_id') || "";
        let currentPin = localStorage.getItem('owner_pin') || "";

        window.onload = function() {
            if (currentProductId && currentPin) {
                document.getElementById('login-id').value = currentProductId;
                document.getElementById('login-pin').value = currentPin;
                ownerLogin();
            }
        };

        function ownerLogin() {
            const id = document.getElementById('login-id').value.trim();
            const pin = document.getElementById('login-pin').value.trim();

            if (!id || !pin) {
                alert("ID Kartu dan PIN wajib diisi!");
                return;
            }

            fetch(`${SCRIPT_URL}?action=owner_login&product_id=${encodeURIComponent(id)}&pin=${encodeURIComponent(pin)}&t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        currentProductId = id;
                        currentPin = pin;
                        localStorage.setItem('owner_product_id', id);
                        localStorage.setItem('owner_pin', pin);
                        
                        updateDashboardData(res.data);
                        
                        document.getElementById('login-section').classList.add('hidden');
                        document.getElementById('dashboard-section').classList.remove('hidden');
                    } else {
                        alert(res.message || "Gagal masuk, periksa kembali ID dan PIN Anda.");
                    }
                })
                .catch(() => {
                    alert("Terjadi kesalahan koneksi. Silakan coba lagi.");
                });
        }

        function refreshStats() {
            fetch(`${SCRIPT_URL}?action=refresh_stats&product_id=${encodeURIComponent(currentProductId)}&pin=${encodeURIComponent(currentPin)}&t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        updateDashboardData(res.data);
                    } else {
                        alert("Gagal memuat data terbaru.");
                    }
                })
                .catch(() => {
                    alert("Koneksi terputus saat memperbarui data.");
                });
        }

        function updateDashboardData(data) {
            document.getElementById('dash-business-name').textContent = data.business_name || "Nama Bisnis";
            document.getElementById('stat-visitor').textContent = data.visitor || 0;
            document.getElementById('stat-maps').textContent = data.maps || 0;
            document.getElementById('stat-wa').textContent = data.wa || 0;

            if (data.ratings) {
                document.getElementById('stat-total-ulasan').textContent = (data.ratings.total || 0) + " Ulasan";
                document.getElementById('stat-overall-rating').textContent = (data.ratings.overall || "0.0") + " ★";
                document.getElementById('b5').textContent = data.ratings.b5 || 0;
                document.getElementById('b4').textContent = data.ratings.b4 || 0;
                document.getElementById('b3').textContent = data.ratings.b3 || 0;
                document.getElementById('b2').textContent = data.ratings.b2 || 0;
                document.getElementById('b1').textContent = data.ratings.b1 || 0;
            }
        }

        function confirmReset() {
            if (confirm("PERINGATAN: Apakah Anda yakin ingin mereset kartu ini? Semua data statistik dan ulasan akan dihapus permanen dan kartu kembali ke status unactivated.")) {
                
                fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "reset_card",
                        product_id: currentProductId,
                        pin: currentPin
                    })
                })
                .then(res => res.json())
                .then(res => {
                    alert("Reset Berhasil! Kartu kembali ke status unactivated.");
                    logoutOwner();
                })
                .catch(() => {
                    alert("Reset Berhasil!");
                    logoutOwner();
                });
            }
        }

        function logoutOwner() {
            localStorage.removeItem('owner_product_id');
            localStorage.removeItem('owner_pin');
            location.reload();
        }
    </script>
</body>
</html>
