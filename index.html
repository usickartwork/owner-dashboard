<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Owner - Login</title>
    
    <!-- Konfigurasi PWA agar bisa di-install jadi aplikasi di HP -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Owner App">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f6f9; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 90vh; 
            color: #333; 
        }
        .box { 
            width: 100%; 
            max-width: 400px; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #0f172a; 
            margin-top: 0; 
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            font-size: 14px; 
            color: #475569; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 16px; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
        }
        button:hover { 
            background: #1d4ed8; 
        }
        
        /* Styling Dashboard */
        .card { 
            background: #0f172a; 
            color: white; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
        }
        .card h3 { 
            margin: 0 0 5px 0; 
            font-size: 14px; 
            color: #94a3b8; 
        }
        .card p { 
            margin: 0; 
            font-size: 24px; 
            font-weight: bold; 
        }
        .btn-logout { 
            background: #ef4444; 
            margin-top: 15px; 
        }
        .btn-logout:hover { 
            background: #dc2626; 
        }
        .btn-refresh { 
            background: #10b981; 
            margin-bottom: 10px; 
        }
        .btn-refresh:hover { 
            background: #059669; 
        }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN MANUAL -->
    <div class="box" id="loginScreen">
        <h2>🔐 Login Dashboard Owner</h2>
        
        <div class="form-group">
            <label>ID / Link Kartu</label>
            <input type="text" id="inputCardId" placeholder="Contoh: NFC-001">
        </div>
        
        <div class="form-group">
            <label>PIN Kartu</label>
            <input type="password" id="inputPin" placeholder="Masukkan PIN rahasia">
        </div>
        
        <button onclick="prosesLogin()">Masuk Dashboard</button>
    </div>

    <!-- HALAMAN DASHBOARD (Awalnya Disembunyikan) -->
    <div class="box" id="dashboardScreen" style="display: none;">
        <h2 id="titleDashboard">📊 Dashboard Statistik</h2>
        
        <div class="card">
            <h3>Total Pengunjung</h3>
            <p id="statVisitor">0</p>
        </div>
        <div class="card">
            <h3>Total Klik Google Maps</h3>
            <p id="statMaps">0</p>
        </div>
        <div class="card">
            <h3>Total Klik WhatsApp</h3>
            <p id="statWA">0</p>
        </div>

        <button class="btn-refresh" onclick="refreshData()">Perbarui Data</button>
        <button class="btn-logout" onclick="logoutApp()">Keluar (Ganti Kartu)</button>
    </div>

    <script>
        // --- 1. MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI ---
        const URL_API = "https://script.google.com/macros/s/AKfycbwrtnBlUReH1zbGHGwbhg3YOCsyunDlmAHkaw9pIo-SRr3WNRCIOD0esEwpUHMwKMgg/exec";

        // Variabel untuk menyimpan ID kartu yang sedang aktif
        let activeCardId = "";

        window.onload = function() {
            // Cek apakah sebelumnya sudah pernah login di HP ini
            let savedCardId = localStorage.getItem("active_owner_card");
            if (savedCardId && localStorage.getItem("owner_logged_" + savedCardId) === "true") {
                activeCardId = savedCardId;
                tampilkanDashboardFromCache();
            }
        };

        function prosesLogin() {
            let cardIdVal = document.getElementById("inputCardId").value.trim();
            let pinVal = document.getElementById("inputPin").value.trim();

            if (!cardIdVal || !pinVal) {
                alert("ID Kartu dan PIN wajib diisi!");
                return;
            }

            alert("Memverifikasi data ke database spreadsheet...");

            // Kirim request ke Google Apps Script
            fetch(`${URL_API}?action=login&link=${encodeURIComponent(cardIdVal)}&pin=${encodeURIComponent(pinVal)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        activeCardId = cardIdVal;

                        // Simpan sesi login ke LocalStorage HP
                        localStorage.setItem("active_owner_card", activeCardId);
                        localStorage.setItem("owner_logged_" + activeCardId, "true");
                        localStorage.setItem("stat_visitor_" + activeCardId, data.visitor);
                        localStorage.setItem("stat_maps_" + activeCardId, data.maps);
                        localStorage.setItem("stat_wa_" + activeCardId, data.wa);

                        tampilkanDashboardFromCache();
                    } else {
                        alert(data.message); // Pesan error dari database (ID/PIN salah)
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Terjadi kesalahan koneksi ke database.");
                });
        }

        function tampilkanDashboardFromCache() {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("dashboardScreen").style.display = "block";
            
            // Ubah judul dashboard sesuai ID kartu yang aktif
            document.getElementById("titleDashboard").innerText = "📊 Dashboard - " + activeCardId;

            // Tampilkan data statistik dari memori HP
            document.getElementById("statVisitor").innerText = localStorage.getItem("stat_visitor_" + activeCardId) || 0;
            document.getElementById("statMaps").innerText = localStorage.getItem("stat_maps_" + activeCardId) || 0;
            document.getElementById("statWA").innerText = localStorage.getItem("stat_wa_" + activeCardId) || 0;
        }

        function refreshData() {
            alert("Memperbarui data statistik terbaru...");
            location.reload();
        }

        function logoutApp() {
            // Hapus sesi login kartu aktif
            if (activeCardId) {
                localStorage.removeItem("owner_logged_" + activeCardId);
                localStorage.removeItem("stat_visitor_" + activeCardId);
                localStorage.removeItem("stat_maps_" + activeCardId);
                localStorage.removeItem("stat_wa_" + activeCardId);
            }
            localStorage.removeItem("active_owner_card");
            location.reload(); 
        }
    </script>
</body>
</html>
