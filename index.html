<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Statistik Kartu</title>
    
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0f172a; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 92vh; 
            color: #1e293b; 
        }

        .wrapper { 
            width: 100%; 
            max-width: 440px; 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); 
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .login-header h2 {
            margin: 0 0 8px 0;
            color: #0f172a;
            font-size: 24px;
            font-weight: 700;
        }
        .login-header p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            font-size: 13px; 
            color: #475569; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input { 
            width: 100%; 
            padding: 14px 16px; 
            background: #f8fafc;
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 15px; 
            color: #0f172a;
        }
        input:focus { 
            outline: none; 
            border-color: #3b82f6; 
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); 
        }

        .btn-primary { 
            width: 100%; 
            padding: 14px; 
            background: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 15px; 
        }
        .btn-primary:hover { background: #1d4ed8; }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 15px;
        }
        .dash-header h2 {
            margin: 0;
            font-size: 18px;
            color: #0f172a;
            font-weight: 700;
        }
        .badge-id {
            background: #eff6ff;
            color: #2563eb;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card { 
            background: #f8fafc; 
            border: 1px solid #e2e8f0;
            padding: 18px 20px; 
            border-radius: 14px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-info h3 { 
            margin: 0 0 4px 0; 
            font-size: 13px; 
            color: #64748b; 
            font-weight: 500;
        }
        .stat-info p { 
            margin: 0; 
            font-size: 26px; 
            font-weight: 700; 
            color: #0f172a; 
        }
        .stat-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .icon-visitor { background: #e0f2fe; color: #0284c7; }
        .icon-maps { background: #dcfce7; color: #16a34a; }
        .icon-wa { background: #fef3c7; color: #d97706; }

        .dash-actions {
            display: flex;
            gap: 10px;
        }
        .btn-refresh { 
            flex: 1;
            padding: 12px; 
            background: #f1f5f9; 
            color: #334155; 
            border: none; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 14px;
        }
        .btn-refresh:hover { background: #e2e8f0; }

        .btn-logout { 
            flex: 1;
            padding: 12px; 
            background: #fef2f2; 
            color: #dc2626; 
            border: none; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 14px;
        }
        .btn-logout:hover { background: #fee2e2; }

        .loading-overlay {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- HALAMAN LOGIN -->
        <div id="loginScreen">
            <div class="login-header">
                <h2>🔐 Owner Portal</h2>
                <p>Masukkan ID dan PIN kartu untuk masuk</p>
            </div>
            
            <div class="form-group">
                <label>ID Kartu / Produk</label>
                <input type="text" id="inputCardId" placeholder="Contoh: NFC-001" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>PIN Rahasia</label>
                <input type="password" id="inputPin" placeholder="••••••••">
            </div>
            
            <button class="btn-primary" onclick="prosesLogin()">Masuk Dashboard</button>
            <div id="loadingText" class="loading-overlay">Menghubungkan ke database...</div>
        </div>

        <!-- HALAMAN DASHBOARD -->
        <div id="dashboardScreen" style="display: none;">
            <div class="dash-header">
                <div>
                    <h2 id="titleDashboard">Dashboard Statistik</h2>
                    <span id="badgeCardId" class="badge-id">ID: -</span>
                </div>
                <span style="font-size: 22px;">📊</span>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Total Pengunjung</h3>
                        <p id="statVisitor">0</p>
                    </div>
                    <div class="stat-icon icon-visitor">👥</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Total Klik Google Maps</h3>
                        <p id="statMaps">0</p>
                    </div>
                    <div class="stat-icon icon-maps">📍</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Total Klik Masukan WA</h3>
                        <p id="statWA">0</p>
                    </div>
                    <div class="stat-icon icon-wa">💬</div>
                </div>
            </div>

            <div class="dash-actions">
                <button class="btn-refresh" onclick="refreshData()">🔄 Refresh</button>
                <button class="btn-logout" onclick="logoutApp()">🚪 Keluar</button>
            </div>
        </div>
    </div>

    <script>
        // Masukkan URL Web App Google Apps Script Anda yang sama di sini
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCV2-_bBSOJ0QqiW2Zu0zUViO-T42IAihhF_-LSiwqRT26i0-3QZdKTmMC8VW1ovHH/exec";

        let activeCardId = "";

        window.onload = function() {
            let savedCardId = localStorage.getItem("active_owner_card");
            if (savedCardId && localStorage.getItem("owner_logged_" + savedCardId) === "true") {
                activeCardId = savedCardId;
                tampilkanDashboardFromCache();
            }
        };

        function prosesLogin() {
            let cardIdVal = document.getElementById("inputCardId").value.trim();
            let pinVal = document.getElementById("inputPin").value.trim();

            if (!cardIdVal || !pinVal) {
                alert("ID Kartu dan PIN wajib diisi!");
                return;
            }

            document.getElementById("loadingText").style.display = "block";

            fetch(`${SCRIPT_URL}?action=owner_login&product_id=${encodeURIComponent(cardIdVal)}&pin=${encodeURIComponent(pinVal)}`)
                .then(response => response.json())
                .then(res => {
                    document.getElementById("loadingText").style.display = "none";
                    if (res.success) {
                        activeCardId = cardIdVal;

                        localStorage.setItem("active_owner_card", activeCardId);
                        localStorage.setItem("owner_logged_" + activeCardId, "true");
                        localStorage.setItem("stat_visitor_" + activeCardId, res.data.visitor);
                        localStorage.setItem("stat_maps_" + activeCardId, res.data.maps);
                        localStorage.setItem("stat_wa_" + activeCardId, res.data.wa);

                        tampilkanDashboardFromCache();
                    } else {
                        alert(res.message);
                    }
                })
                .catch(error => {
                    document.getElementById("loadingText").style.display = "none";
                    console.error("Error:", error);
                    alert("Terjadi kesalahan koneksi ke database.");
                });
        }

        function tampilkanDashboardFromCache() {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("dashboardScreen").style.display = "block";
            
            document.getElementById("badgeCardId").innerText = "ID: " + activeCardId;

            document.getElementById("statVisitor").innerText = localStorage.getItem("stat_visitor_" + activeCardId) || 0;
            document.getElementById("statMaps").innerText = localStorage.getItem("stat_maps_" + activeCardId) || 0;
            document.getElementById("statWA").innerText = localStorage.getItem("stat_wa_" + activeCardId) || 0;
        }

        function refreshData() {
            if (!activeCardId) {
                location.reload();
                return;
            }

            const btnRefresh = document.querySelector('.btn-refresh');
            btnRefresh.innerText = "Memperbarui...";

            fetch(`${SCRIPT_URL}?action=refresh_stats&product_id=${encodeURIComponent(activeCardId)}`)
                .then(response => response.json())
                .then(res => {
                    btnRefresh.innerText = "🔄 Refresh";
                    if (res.success) {
                        localStorage.setItem("stat_visitor_" + activeCardId, res.data.visitor);
                        localStorage.setItem("stat_maps_" + activeCardId, res.data.maps);
                        localStorage.setItem("stat_wa_" + activeCardId, res.data.wa);

                        document.getElementById("statVisitor").innerText = res.data.visitor;
                        document.getElementById("statMaps").innerText = res.data.maps;
                        document.getElementById("statWA").innerText = res.data.wa;

                        alert("Data statistik berhasil diperbarui ke angka terbaru!");
                    } else {
                        alert("Gagal memperbarui data.");
                    }
                })
                .catch(error => {
                    btnRefresh.innerText = "🔄 Refresh";
                    console.error("Error:", error);
                    alert("Terjadi kesalahan koneksi saat memperbarui data.");
                });
        }

        function logoutApp() {
            if (activeCardId) {
                localStorage.removeItem("owner_logged_" + activeCardId);
                localStorage.removeItem("stat_visitor_" + activeCardId);
                localStorage.removeItem("stat_maps_" + activeCardId);
                localStorage.removeItem("stat_wa_" + activeCardId);
            }
            localStorage.removeItem("active_owner_card");
            location.reload(); 
        }
    </script>
</body>
</html>
