<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Owner - Verifikasi Kartu</title>
    
    <!-- Konfigurasi PWA agar bisa di-install jadi aplikasi di HP -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Owner App">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f6f9; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 90vh; 
            color: #333; 
        }
        .box { 
            width: 100%; 
            max-width: 400px; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #0f172a; 
            margin-top: 0; 
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            font-size: 14px; 
            color: #475569; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 16px; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
        }
        button:hover { 
            background: #1d4ed8; 
        }
        
        /* Styling Dashboard */
        .card { 
            background: #0f172a; 
            color: white; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
        }
        .card h3 { 
            margin: 0 0 5px 0; 
            font-size: 14px; 
            color: #94a3b8; 
        }
        .card p { 
            margin: 0; 
            font-size: 24px; 
            font-weight: bold; 
        }
        .btn-logout { 
            background: #ef4444; 
            margin-top: 15px; 
        }
        .btn-logout:hover { 
            background: #dc2626; 
        }
        .btn-refresh { 
            background: #10b981; 
            margin-bottom: 10px; 
        }
        .btn-refresh:hover { 
            background: #059669; 
        }
        #infoCardId { 
            text-align: center; 
            color: #2563eb; 
            font-weight: bold; 
            font-size: 15px; 
            margin-bottom: 20px;
            background: #eff6ff;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div class="box" id="loginScreen">
        <h2>🔐 Login Owner</h2>
        <div id="infoCardId">Memuat ID Kartu...</div>
        
        <div class="form-group">
            <label>PIN Kartu</label>
            <input type="password" id="inputPin" placeholder="Masukkan PIN rahasia kartu ini">
        </div>
        <button onclick="prosesLogin()">Masuk Dashboard</button>
    </div>

    <!-- HALAMAN DASHBOARD (Awalnya Disembunyikan) -->
    <div class="box" id="dashboardScreen" style="display: none;">
        <h2 id="titleDashboard">📊 Dashboard Statistik</h2>
        
        <div class="card">
            <h3>Total Pengunjung</h3>
            <p id="statVisitor">0</p>
        </div>
        <div class="card">
            <h3>Total Klik Google Maps</h3>
            <p id="statMaps">0</p>
        </div>
        <div class="card">
            <h3>Total Klik WhatsApp</h3>
            <p id="statWA">0</p>
        </div>

        <button class="btn-refresh" onclick="refreshData()">Perbarui Data</button>
        <button class="btn-logout" onclick="logoutApp()">Keluar (Logout)</button>
    </div>

    <script>
        // --- 1. MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI ---
        const URL_API = "https://script.google.com/macros/s/AKfycbzQWr3zC1uBHHSzbV1Gd930BwBrM3WterDk8DkTNrxkAzO-gmOaXhzRBoAETIlh1hbJ/exec";

        // Ambil parameter "?id=" secara otomatis dari URL browser (Contoh: ?id=NFC-001)
        const urlParams = new URLSearchParams(window.location.search);
        const cardIdFromUrl = urlParams.get("id"); 

        window.onload = function() {
            // Validasi jika link dibuka tanpa parameter ID di belakangnya
            if (!cardIdFromUrl) {
                document.body.innerHTML = `
                    <div class="box" style="text-align:center;">
                        <h2 style="color:#ef4444;">Link Kartu Tidak Valid 🚫</h2>
                        <p style="color:#64748b;">Pastikan Anda membuka link khusus dashboard yang menyertakan ID kartu, contoh:</p>
                        <code style="background:#f1f5f9; padding:6px; display:block; border-radius:4px; margin-top:10px;">
                            namadomain.vercel.app/?id=NFC-001
                        </code>
                    </div>`;
                return;
            }

            // Tampilkan ID kartu yang sedang diakses pada layar login
            document.getElementById("infoCardId").innerText = "ID Kartu: " + cardIdFromUrl;

            // Cek apakah owner sudah pernah login sebelumnya untuk kartu ini di HP ini
            if (localStorage.getItem("owner_logged_" + cardIdFromUrl) === "true") {
                tampilkanDashboardFromCache();
            }
        };

        function prosesLogin() {
            let pinVal = document.getElementById("inputPin").value.trim();

            if (!pinVal) {
                alert("Silakan masukkan PIN kartu terlebih dahulu!");
                return;
            }

            // Beritahu user proses verifikasi sedang berjalan
            alert("Memverifikasi PIN ke database...");

            // Kirim request ke Google Apps Script (membawa parameter id dan pin)
            fetch(`${URL_API}?action=login&link=${cardIdFromUrl}&pin=${pinVal}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        // Simpan status dan data statistik khusus untuk ID kartu ini ke memori HP
                        localStorage.setItem("owner_logged_" + cardIdFromUrl, "true");
                        localStorage.setItem("stat_visitor_" + cardIdFromUrl, data.visitor);
                        localStorage.setItem("stat_maps_" + cardIdFromUrl, data.maps);
                        localStorage.setItem("stat_wa_" + cardIdFromUrl, data.wa);

                        tampilkanDashboardFromCache();
                    } else {
                        alert(data.message); // Pesan jika PIN salah dari Google Spreadsheet
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Terjadi kesalahan koneksi ke database spreadsheet.");
                });
        }

        function tampilkanDashboardFromCache() {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("dashboardScreen").style.display = "block";
            
            // Ubah judul dashboard sesuai ID kartu yang aktif
            document.getElementById("titleDashboard").innerText = "📊 Dashboard - " + cardIdFromUrl;

            // Ambil dan tampilkan data statistik dari LocalStorage HP
            document.getElementById("statVisitor").innerText = localStorage.getItem("stat_visitor_" + cardIdFromUrl) || 0;
            document.getElementById("statMaps").innerText = localStorage.getItem("stat_maps_" + cardIdFromUrl) || 0;
            document.getElementById("statWA").innerText = localStorage.getItem("stat_wa_" + cardIdFromUrl) || 0;
        }

        function refreshData() {
            // Melakukan verifikasi ulang/tarik data terbaru dari spreadsheet dengan PIN yang tersimpan
            alert("Memperbarui data statistik terbaru...");
            location.reload();
        }

        function logoutApp() {
            // Hapus sesi login khusus kartu ini
            localStorage.removeItem("owner_logged_" + cardIdFromUrl);
            localStorage.removeItem("stat_visitor_" + cardIdFromUrl);
            localStorage.removeItem("stat_maps_" + cardIdFromUrl);
            localStorage.removeItem("stat_wa_" + cardIdFromUrl);
            location.reload(); 
        }
    </script>
</body>
</html>
